name: E2E Tests

on:
  push:
    branches: [playWright]
  pull_request:
    branches: [playWright]
  # Allows triggering manually from the Actions tab in GitHub
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true
          E2E_BACKEND_URL: https://weather-backend-docker.onrender.com

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        # Always upload the report, even if tests failed — that's exactly
        # when you need it most to see what went wrong.
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
