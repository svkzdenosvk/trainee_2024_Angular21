<div class="app-container">
  <header class="app-header">
    <h1>{{ cityService.selectedCity()?.name }} {{ 'header.title' | transloco }}</h1>
    <p>{{ 'header.subtitle' | transloco }}</p>
  </header>

  <!-- <div class="nav-actions">
   
    @if (authService.isLoggedIn()) {
      <button class="lang-btn logout-btn" (click)="authService.logout()">
        <i class="pi pi-sign-out"></i>
        {{ 'auth.logout' | transloco }}
      </button>
    } @else {
      <button class="lang-btn" (click)="router.navigate(['/login'])">
        <i class="pi pi-sign-in"></i>
        {{ 'auth.btnLogin' | transloco }}
      </button>
      <button class="lang-btn register-btn" (click)="router.navigate(['/register'])">
        <i class="pi pi-user-plus"></i>
        {{ 'auth.btnRegister' | transloco }}
      </button>
    }
  </div> -->
  <nav class="app-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <i class="pi pi-map-marker"></i>
      {{ 'nav.home' | transloco }}
    </a>
    <a routerLink="/heat-index" routerLinkActive="active">
      <i class="pi pi-sun"></i> {{ 'nav.heatIndex' | transloco }}</a
    >
    <div class="nav-actions">
      <button class="lang-btn" (click)="switchLang('en')" [class.active]="currentLang() === 'en'">
        EN
      </button>
      <button class="lang-btn" (click)="switchLang('sk')" [class.active]="currentLang() === 'sk'">
        SK
      </button>
    </div>
  </nav>
  <nav class="app-nav">
    <a [routerLink]="['/weather']" [queryParams]="cityParams()" routerLinkActive="active">
      <i class="pi pi-table"></i> {{ 'nav.weather' | transloco }}
    </a>
    <a [routerLink]="['/chart']" [queryParams]="cityParams()" routerLinkActive="active">
      <i class="pi pi-chart-line"></i> {{ 'nav.temperatureChart' | transloco }}
    </a>
  </nav>

  <main>
    <router-outlet />
  </main>

  <footer class="app-footer">{{ 'footer' | transloco }}</footer>
</div>
