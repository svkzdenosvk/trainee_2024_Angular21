<div class="app-container">
  <header class="app-header">
    <!-- <div class="header-icon">🌦️</div> -->
    <h1>{{ cityService.selectedCity()?.name }} Weather</h1>
    <p>Hourly forecast & historical data · Open-Meteo API</p>
  </header>

  <nav class="app-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <i class="pi pi-map-marker"></i>
      {{ 'Choose City' }}
    </a>
    <a [routerLink]="['/weather']" [queryParams]="cityParams()" routerLinkActive="active">
      <i class="pi pi-table"></i> Weather Data
    </a>
    <a [routerLink]="['/chart']" [queryParams]="cityParams()" routerLinkActive="active">
      <i class="pi pi-chart-line"></i> Temperature Chart
    </a>
    <a routerLink="/heat-index" routerLinkActive="active">
      <i class="pi pi-sun"></i> Heat Index
    </a>
  </nav>

  <main>
    <router-outlet />
  </main>

  <footer class="app-footer">© 2026 Weather App. All rights reserved.</footer>
</div>
