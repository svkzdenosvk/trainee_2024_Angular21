<div class="app-container">
  <!-- //user, login reg. logout buttons -->
  <app-nav-auth />

  <app-header [cityName]="cityService.selectedCity()?.name" />

  <nav class="app-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <i class="pi pi-map-marker"></i>{{ 'nav.home' | transloco }}
    </a>
    <a routerLink="/heat-index" routerLinkActive="active">
      <i class="pi pi-sun"></i> {{ 'nav.heatIndex' | transloco }}
    </a>
    @if (authService.isLoggedIn()) {
      <a routerLink="/favourites" routerLinkActive="active">
        <i class="pi pi-star"></i>
        {{ 'nav.favourites' | transloco }}
      </a>
    }
    <!--  lang switcher   -->
    <app-lang-switcher /> 
  </nav>
  <nav class="app-nav">
    <a [routerLink]="['/weather']" [queryParams]="cityParams()" routerLinkActive="active">
      <i class="pi pi-table"></i> {{ 'nav.weather' | transloco }}
    </a>
    <a [routerLink]="['/chart']" [queryParams]="cityParams()" routerLinkActive="active">
      <i class="pi pi-chart-line"></i> {{ 'nav.temperatureChart' | transloco }}
    </a>
  </nav>

  <main>
    <router-outlet />
  </main>

  <app-footer />
</div>
