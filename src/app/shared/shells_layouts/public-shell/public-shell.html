<div class="public-container">
  <div class="nav-actions-auth">
    @if (authService.isLoggedIn()) {
      <button class="lang-btn logout-btn" (click)="authService.logout()">
        <i class="pi pi-sign-out"></i>
        {{ 'auth.logout' | transloco }}
      </button>
    } @else {
      <button class="lang-btn" (click)="router.navigate(['/login'])">
        <i class="pi pi-sign-in"></i>
        {{ 'auth.btnLogin' | transloco }}
      </button>
      <button class="lang-btn register-btn" (click)="router.navigate(['/register'])">
        <i class="pi pi-user-plus"></i>
        {{ 'auth.register.btnRegister' | transloco }}
      </button>
    }
  </div>
  <header class="app-header">
    <h1>{{ 'header.title' | transloco }}</h1>
    <!-- <h1>{{ cityService.selectedCity()?.name }} Weather</h1> -->

    <p>{{ 'header.subtitle' | transloco }}</p>
  </header>

  <nav class="app-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <i class="pi pi-map-marker"></i> {{ 'nav.home' | transloco }}
    </a>
    <a routerLink="/heat-index" routerLinkActive="active">
      <i class="pi pi-sun"></i> {{ 'nav.heatIndex' | transloco }}
    </a>
    <div class="nav-actions">
      <button class="lang-btn" (click)="switchLang('en')" [class.active]="currentLang() === 'en'">
        EN
      </button>
      <button class="lang-btn" (click)="switchLang('sk')" [class.active]="currentLang() === 'sk'">
        SK
      </button>
    </div>
  </nav>

  <main>
    <router-outlet />
  </main>

  <footer class="app-footer">
    {{ 'footer' | transloco }}
  </footer>
</div>
