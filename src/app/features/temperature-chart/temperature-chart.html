<div class="chart-container">
  <div class="controls-bar">
    <div class="date-range-wrapper">
      <label>{{ 'dateRange' | transloco }}</label>
      <p-datepicker
        [(ngModel)]="dateRange"
        (ngModelChange)="dateRange.set($event)"
        selectionMode="range"
        [readonlyInput]="true"
        dateFormat="yy-mm-dd"
        [placeholder]="'dateRangePlaceholder' | transloco"
        [showIcon]="true"
        [numberOfMonths]="2"
      >
      </p-datepicker>
    </div>
    <p-button
      [label]="'btnLoadData' | transloco"
      icon="pi pi-refresh"
      severity="secondary"
      (onClick)="loadData()"
      [disabled]="loading()"
    />
    <div class="view-mode-wrapper">
      <label>{{ 'temperatureChart.view' | transloco }}</label>

      <div class="custom-select-btn">
        <button
          [class.active]="viewMode() === 'all'"
          (click)="viewMode.set('all'); onViewModeChange()"
        >
          {{ 'temperatureChart.viewMode.hourly' | transloco }}
        </button>
        <button
          [class.active]="viewMode() === 'daily'"
          (click)="viewMode.set('daily'); onViewModeChange()"
        >
          {{ 'temperatureChart.viewMode.daily' | transloco }}
        </button>
      </div>
    </div>
  </div>

  @if (loading()) {
    <div class="loading-wrapper" role="status" aria-live="polite">
      <p-progressSpinner strokeWidth="3" aria-hidden="true" />
      <p>{{ 'temperatureChart.loading' | transloco }}</p>
    </div>
  }

  @if (error()) {
    <div class="error-banner" role="alert" aria-live="assertive">
      <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
      {{ error() | transloco }}
    </div>
  }

  <div class="canvas-wrapper" [class.hidden]="loading()">
    <canvas
      #chartCanvas
      role="img"
      [attr.aria-label]="'Temperature chart for ' + cityService.selectedCity()?.name"
    ></canvas>
  </div>
</div>
