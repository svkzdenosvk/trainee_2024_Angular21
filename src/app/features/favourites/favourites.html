<div class="favourites-container">
  @if (favourites().length === 0) {
    <div class="empty-state">
      <i class="pi pi-star"></i>
      <p>{{ 'favourites.empty' | transloco }}</p>
      <small>{{ 'favourites.emptyAdvice' | transloco }}</small>
    </div>
  }

  @if (isFull()) {
    <div class="full-banner">
      <i class="pi pi-exclamation-triangle"></i>
      {{ 'favourites.fullWarning' | transloco }}
    </div>
  }

  <div class="favourites-list" [@listAnimation]="favourites().length">
    @for (city of favourites(); track city.id ?? city.lat + city.lon) {
      <div class="favourite-item">
        <div class="city-info">
          <i class="pi pi-star-fill star-icon"></i>
          <div>
            <span class="city-name">{{ city.name }}</span>
            <span class="city-country">{{ city.country }}</span>
          </div>
        </div>
        <div class="actions">
          <button class="action-btn remove-btn" (click)="remove(city)">
            <i class="pi pi-trash" style="font-size: 1rem"></i>
          </button>
          <button class="action-btn select-btn" (click)="selectCity(city)">
            → {{ 'favourites.select' | transloco }}
          </button>
        </div>
      </div>
    }
  </div>
</div>
