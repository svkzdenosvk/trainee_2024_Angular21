<div class="error-container">
  <div class="error-card">
    <div class="error-icon">⚡</div>
    <h2>{{ 'error_page.title' | transloco }}</h2>
    <p>{{ 'error_page.subtitle' | transloco }}</p>
    <div class="error-actions">
      <p-button [label]="'error_page.goHome' | transloco" icon="pi pi-home" (onClick)="goHome()" />
      <p-button
        [label]="'error_page.retry' | transloco"
        icon="pi pi-refresh"
        severity="secondary"
        [text]="true"
        (onClick)="retry()"
      />
    </div>
  </div>
</div>
