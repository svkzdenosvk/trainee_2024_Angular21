<!-- <div id="map" class="map-container"></div> -->

<div class="map-wrapper">
  @if (showNoCity()) {
    <div class="map-banner warning">
      <i class="pi pi-map-marker"></i>
            {{ 'cityMap.noCity' | transloco }}
    </div>
  }

  @if (showFullWarning()) {
    <div class="map-banner danger">
      <i class="pi pi-exclamation-triangle"></i>
      {{ 'favourites.fullWarning' | transloco }}
    </div>
  }

  <div id="map" class="map-container"></div>
</div>
