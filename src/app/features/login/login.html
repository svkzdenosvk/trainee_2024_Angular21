<div class="log-reg-container">
  <div class="log-reg-card">
    <div class="log-reg-header">
      <div class="log-reg-icon">🔐</div>
      <h2>{{ 'auth.title' | transloco }}</h2>
    </div>

    <form class="log-reg-form" [formGroup]="form">
      <div class="form-group">
        <label>{{ 'auth.username' | transloco }}</label>
        <input
          pInputText
          type="text"
          formControlName="username"
          [placeholder]="'auth.usernamePlaceholder' | transloco"
        />
      </div>

      <div class="form-group">
        <label>{{ 'auth.password' | transloco }}</label>
        <div class="input-wrapper">
          <input
            pInputText
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            [placeholder]="'auth.passwordPlaceholder' | transloco"
          />
          <button
            type="button"
            class="eye-btn"
            (click)="showPassword.set(!showPassword())"
            tabindex="-1"
          >
            <i [class]="showPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
          </button>
        </div>
      </div>

      @if (error()) {
        <div class="error-banner" [@fadeInOut]>
          <i class="pi pi-exclamation-triangle"></i>
          {{ error() | transloco }}
        </div>
      }

      <p-button
        [label]="'auth.btnLogin' | transloco"
        icon="pi pi-sign-in"
        styleClass="log-reg-btn"
        [loading]="loading()"
        [disabled]="form.invalid || loading()"
        (onClick)="login()"
      />
    </form>

    <div class="log-reg-hint">
      <p>{{ 'auth.defaultCredentials' | transloco }}:</p>
      <code>admin / Admin123*</code>
      <code>user / User123*</code>
    </div>
  </div>
</div>
