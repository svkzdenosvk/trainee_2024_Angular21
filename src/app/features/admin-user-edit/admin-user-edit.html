<div class="profile-container">
  <h2>
    <i class="pi pi-user-edit" aria-hidden="true"></i>
    {{ 'auth.edit.adminEdit.title' | transloco }}
  </h2>

  @if (error()) {
    <div class="error-banner" role="alert" aria-live="assertive">
      <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
      {{ error() | transloco }}
    </div>
  }

  @if (success()) {
    <div class="success-banner" [@fadeInOut] role="status" aria-live="polite">
      <i class="pi pi-check" aria-hidden="true"></i>
      {{ 'auth.edit.profile.success' | transloco }}
    </div>
  }

  <form [formGroup]="form">
    <div class="form-group">
      <label for="profile-username">{{ 'auth.edit.profile.username' | transloco }}</label>
      <div class="input-wrapper">
        <input
          id="profile-username"
          pInputText
          formControlName="username"
          [disabled]="isDefaultUserProtected()"
          autocomplete="username"
          [attr.aria-describedby]="getFieldError('username') ? 'profile-username-error' : null"
        />

        @if (form.get('username')?.pending) {
          <i class="pi pi-spin pi-spinner input-spinner" aria-hidden="true"></i>
        }
      </div>
      @if (getFieldError('username')) {
        <small id="profile-username-error" class="field-error" role="alert">
          {{ getFieldError('username') | transloco }}
        </small>
      }
    </div>

    <div class="actions">
      <p-button
        [label]="'auth.edit.profile.save' | transloco"
        [loading]="loading()"
        [pTooltip]="getSaveTooltip()"
        [attr.aria-label]="getSaveTooltip()"
        [attr.aria-busy]="loading()"
        [disabled]="!hasChanges || loading() || isDefaultUserProtected() || form.invalid"
        (onClick)="save()"
      />
      <p-button
        [label]="'auth.edit.adminEdit.cancel' | transloco"
        severity="secondary"
        [text]="true"
        (onClick)="cancel()"
      />
    </div>
  </form>
</div>
