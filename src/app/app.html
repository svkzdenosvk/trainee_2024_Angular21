<div class="app-container">
  <header class="app-header">
    <!-- <div class="header-icon">🌦️</div> -->
     <h1>
    {{ cityService.selectedCity() ? cityService.selectedCity()!.name + ' Weather' : 'Weather App' }}
  </h1>
    <p>Hourly forecast & historical data · Open-Meteo API</p>
  </header>


  <nav class="app-nav">
    <a routerLink="/weather" routerLinkActive="active">
      <i class="pi pi-table"></i> Weather Data

  </nav>

  <main>
    <router-outlet />
  </main>

  <footer class="app-footer">© 2026 London Weather App. All rights reserved.</footer>
</div>
